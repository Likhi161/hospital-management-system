name: Docker Build & Trivy Scan
run-name: Build-push

on:
  push:
    branches: [ "deploying" ]

jobs:

  # 🔍 JOB 1: Code Quality (SonarQube for Node.js)
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SonarScanner
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Run SonarQube Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=hospital-actions \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://<http://3.110.215.115/>:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}



  # 🐳 JOB 2: Build + Scan + Push
  build-and-scan:
    runs-on: ubuntu-latest
    needs: code-quality   # 🔥 ensures quality passes first

    env:
      IMAGE_NAME: hospital-actions
      TAG: ${{ github.sha }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$TAG .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Docker Image with Trivy
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 $IMAGE_NAME:$TAG

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker Image
        run: |
          docker tag $IMAGE_NAME:$TAG ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$TAG

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$TAG